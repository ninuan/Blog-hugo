baseURL: "https://blog.xxhx.de"
title: "Ninuan's Blog"
paginate: 5
theme: "PaperMod"

locale: "zh-CN"
DefaultContentLanguage: "zh-cn"
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true

buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON   # 搜索功能需要 JSON 索引

params:
  env: production
  description: "Ninuan 的个人博客：把学到的东西写下来，把生活里的片刻留下来。"
  author: "Ninuan"
  mainSections: ["posts"]

  # 首页：个人介绍与最近文章。
  homeInfoParams:
    Title: "Ninuan"
    Content: |
      把学到的东西写下来，把生活里的片刻留下来。
  homeRecentLimit: 10
  # 可填写 /images/avatar.jpg（文件放在 static/images/）或公开图片 URL。
  avatar: ""
  footer:
    text: "[分类](/categories/) · [归档](/archives/) · [订阅](/index.xml)"

  socialIcons:
    - name: email
      title: "邮箱 · vyren0821@gmail.com"
      url: "mailto:vyren0821@gmail.com"
    - name: github
      title: "GitHub · Ninuan"
      url: "https://github.com/ninuan"
    - name: rss
      title: "RSS 订阅"
      url: "/index.xml"

  # 列表页 / 文章页开关
  ShowReadingTime: true
  ShowShareButtons: false
  ShowBreadCrumbs: false
  ShowWordCount: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  hideAuthor: true
  DateFormat: "2006 年 1 月 2 日"
  ShowRssButtonInSectionTermList: true
  showtoc: true
  tocopen: false
  comments: true

  # 搜索（PaperMod 内置，基于 fuse.js）
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: friends
      name: 朋友
      url: /friends/
      weight: 30
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50
    - identifier: about
      name: 关于
      url: /about/
      weight: 40

# 代码由 Hugo 的 Chroma 在构建时高亮，使用 PaperMod 自带的配色。
markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: false
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
