baseURL: "https://blog.xxhx.de"
title: "Ninuan's Blog"
paginate: 5
theme: "PaperMod"

locale: "zh-CN"
DefaultContentLanguage: "zh-cn"
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true

buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON   # 搜索功能需要 JSON 索引

params:
  env: production
  description: "Ninuan 的个人博客：把学到的东西写下来，把生活里的片刻留下来。"
  author: "Ninuan"
  mainSections: ["posts"]

  # 首页保留文章列表，在顶部显示简短的个人介绍。
  homeInfoParams:
    Title: "你好，我是 Ninuan"
    Content: |
      把学到的东西写下来，把生活里的片刻留下来。

      [关于我](/about/) · [文章归档](/archives/)

  socialIcons:
    - name: email
      title: "邮箱 · vyren0821@gmail.com"
      url: "mailto:vyren0821@gmail.com"
    - name: github
      title: "GitHub · Ninuan"
      url: "https://github.com/ninuan"
    - name: rss
      title: "RSS 订阅"
      url: "/index.xml"

  # 列表页 / 文章页开关
  ShowReadingTime: true
  ShowShareButtons: true
  ShowBreadCrumbs: true
  ShowWordCount: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  showtoc: true
  tocopen: false
  comments: true

  # 搜索（PaperMod 内置，基于 fuse.js）
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
    - identifier: about
      name: 关于
      url: /about/
      weight: 50

# 代码由 Hugo 的 Chroma 在构建时高亮，使用 PaperMod 自带的配色。
markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: false
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
