{{- define "main" -}}
<div class="index-layout">
  <header class="page-header">
    <h1>{{ if and (eq .Kind "term") (eq .Type "tags") }}#{{ end }}{{ if eq .Section "posts" }}文章{{ else }}{{ .Title }}{{ end }}</h1>
    {{- with .Description }}<p class="post-description">{{ . }}</p>{{ end -}}
  </header>
  {{- with .Content }}<div class="post-content md-content">{{ . }}</div>{{ end -}}
  {{- partial "year-posts.html" .RegularPagesRecursive -}}
</div>
{{- end -}}
